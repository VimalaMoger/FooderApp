<!DOCTYPE html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta http-equiv="content-type" content="text/html; charset=UTF-8">
		<title>Register</title>
		<script>
			function registerUser(){
				alert("Your information is saved. Please sign in");
				const name = document.getElementById("fName").value;
				const email = document.getElementById("email").value;
		
				localStorage.setItem("userName", name);
				localStorage.setItem("userEmail", email);
				var frm = document.getElementsByName('contact-form')[0];
				frm.reset();  // Reset all form data
			}
		</script>
	</head>
	<body>
		<p1>Details:</p1>
	
		<form name="contact-form" action="signIn.html" onsubmit="registerUser()">
			<div class="Homepage">
				<h1  style="color:red; padding:40px; margin:0;text-align:center;">Please fill out the form below</h1>
	
				<fieldset>
					<legend> User Credentials</legend>
					<label for="email">Email:</label> <input type ="email" id="email" name="name" required/><br><br>
			
					<label>Password:</label> <input type ="password"  required/><br><br>
	
					<label>First Name:</label> <input type ="text" id="fName" required minlength="3" /><br><br>
	
					<label>Last Name:</label> <input type ="text" /><br><br>
				</fieldset>
	
				<fieldset>
					<legend>Address Info</legend>
					<label for = "address"> Address: </label>
					<input type ="text" name="address"/><br><br>
					<label for ="street"> Street: </label>
					<input type ="text" name="street"/><br><br>
					<label for ="state"> State: </label>
					<select id="state" name=state">
						<option value="VA"> VA</option>
						<option value="MD"> MD</option>
						<option value="DC"> DC</option>
					</select><br><br>
					<label for="zipcode"> Zipcode:</label>
						<input type ="text" id="zipcode" name="address-4" maxlength="5"/>
					</label> <br><br>
					<input type="submit" value="submit"/>
				</fieldset>
	
				<div style="text-align:center;">
					<footer>
						<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
				
						<p><a href="index.html">Home</a></p>
						<p><a href="resource/policy.html"  target="_blank">Privacy Policy</a></p>
						<p><a href="resource/terms.html"  target="_blank">Terms & Conditions</a></p>
	
					
						<p>Copyright &copy 2020 All rights reserved;</p>
					</footer>
				</div>
				
			</div>
		</form>
</body>
</html>
