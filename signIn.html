<!DOCTYPE html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta http-equiv="content-type" content="text/html; charset=UTF-8">
		<title>Sign in</title>
		<script>
			function loginUser(){
				
				var firstName = document.getElementById("fName").value;
				var email = document.getElementById("email").value;

				let userName = localStorage.getItem("userName");
				let userEmail = localStorage.getItem("userEmail");

				if(firstName === '' || email === ''){
					alert("Name and email both required ");
					return false;
				}
				if(userName == null || userName !== firstName){
					alert("If you are a new user, Please register to sign in");

					var frm = document.getElementsByName('contact-form')[0];
					frm.reset();  // Reset all form data
					window.location.href = "register.html";
					return false;
				}
				
				localStorage.setItem("userName", firstName);
				localStorage.setItem("userEmail", email);
				//frm.reset();

				//redirect url to displayItems page
				var url = "displayItems.html";
                window.location.href =url;			
			}
		</script>
	</head>
	<body>		

	<form name="contact-form">
		<div class="Homepage">
			<h1  style="color:rgb(31, 27, 27); padding:40px; margin:0;text-align:center;">Please sign in</h1>

			<fieldset>
				<legend> User Credentials</legend>
				<label for="fName">Name:</label> 
				<input type ="text" id="fName" name="fName" required minlength="3" /><br><br>
		
				<label for="email">Email:
				<input type ="email" id="email"  name="email" required/></label> <br><br>
				<button type="button" onclick="loginUser()">Login</button> 
				
			</fieldset>
		</div>
	</form>

	<p>Register: <a href="register.html">Register</a></p>

	<div style="text-align:center;">

</body>
