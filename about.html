<!DOCTYPE html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta http-equiv="content-type" content="text/html; charset=UTF-8">
		<script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
		<title>About Page</title>
		<link rel="stylesheet" href="myStyle.css" /> 
	</head> 

	<body>
		<div class="Homepage">

			<!--Banner Information and animated text-->
			<div>
				<div id="myDIV" style="visibility:hidden">
					Spend $10 on Wholefoods!!
					<div id="open" style="text-align:right;" ><button onclick="bannerclose()" >X</button></div>
					<a  href="https://www.wholefoodsmarket.com" target="_blank" > visit</a>
				</div>
			</div>
			<div class="thickLine"> </div>

			<!--Banner info-->
			<div style="display: flex;">				
				<h2 style="text-align:left">Foodar</h2>								
				<h1 id="banner" >Delicious Food Service</h1>	
			</div>
			<p id="signIn-button">Hello User</p>
			<div class="thickLine"> </div><br>

			<!--Home page site image-->
			<img src="images/HImg.jpg" alt="about page" width="100%" height="350"/>
			<div class= "centered">Try A New Meal Today</div> <br>

			<!--Validate zipcode to find driver near desired location-->
			<p>Find a driver near you!</p>
			<p>Type in your zipcode below and click Go to find a driver near you</p>
			
			<form name="contact-form" onsubmit="checkZipCode()">
				<fieldset>
					<label for="zipcode">Find the closest location: </label> 
					<input type ="zipcode" id="zipcode" name="zipcode" required required maxlength="5" />
					<input type="submit" value="submit" /><br><br>
				</fieldset>								
		    </form>
			<div id="driver"></div>
			<div class="thickLine"> </div>

			<!--Footer section-->
			<footer>
				<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
				<div class="row">
				
				<div class="column">
					<i class="fa fa-facebook" style="padding: 10px;
					font-size: 10px;
					width: 10px;
					text-decoration: none;
					background-color:white;
					border-radius:50%;"></i>
					<i class="fa fa-twitter" style="padding: 10px;
					font-size: 10px;
					width: 10px;
					text-decoration: none;
					background-color:white;
					border-radius:50%;"></i>
				</div>
				<!--policy & terms links-->
				<div class="column"  style="text-align:right;">
					<p>Copyright &copy 2020 All rights reserved;</p>
					<p><a href="index.html">Home</a></p>
					<p><a href="resource/policy.html"  target="_blank">Privacy Policy</a></p>
					<p><a href="resource/terms.html"  target="_blank">Terms & Conditions</a></p>
				</div>				
			</footer>
		</div>


		<!-- javascript code -->
		<script type="text/javascript">
			let user = localStorage.getItem("userName");
			$(function(){
				if(user){
					$("#signIn-button").text(`Hello ${user} !`);
					$("#signIn-button").show();
					$("#signIn-button").css({'color': 'blue','font-size':'35px'});
					$("#signIn-button").append("<em> <a href=\"displayItems.html\">MenuList</a></em>");
				}
			});
			//array data, animated text
			const myBanner = new Array('Oven-Baked Pastas', 'Oven-Baked Sandwiches', 'Specialty Pizzas','Breads & Dips', 'Desserts','Drinks');
			let banner = 0;
			//animation
			function ShowBanners(){ 
				if (document.images){ 
					banner++;
					if (banner === myBanner.length) {
						banner = 0;
					}
					document.getElementById('food').innerHTML = myBanner[banner];
					setTimeout("ShowBanners()",1000);
				}
			}  

			//close the 
			function bannerclose() {
				var x = document.getElementById("myDIV");
					
				if (x.style.display === "none") {
					x.style.display = "block";
				}
				else {
					x.style.display = "none";
					//document.getElementById("open").style.display="none";	
				}
			}

			function hid(){
				document.getElementById("myDIV").style.visibility="visible";
			}
			var val = setTimeout(hid, 5000);
			var b = document.getElementById("myDIV").value;
			
			//Check driver availability in that area
			var zipcodeList = [78717, 78727, 78757, 78769, 78747];
			
			function checkZipCode(){
				for(const i of zipcodeList)	{
					var codeEntered = document.getElementById("zipcode").value;
					const result = zipcodeList.find(num => num == codeEntered);
					if(result === undefined){												
						document.getElementById("driver").innerHTML = "Driver is not available!";							
					}else{											
						document.getElementById("driver").innerHTML = "Driver is available!";						 
					}
				}				
			}	
		</script>
	</body>
</HTML>
